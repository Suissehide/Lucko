# ────────────────────────────────────────────────────────────────
# Lucko — déploiement Dokploy (service de type « Compose »)
#
#   Un service Compose par environnement (staging, production), même fichier :
#   Compose Path : ./deploy/dokploy/docker-compose.dokploy.yml
#   Environment  : variables de deploy/.env.example (vraies valeurs)
#   Domains      : à déclarer dans l'onglet « Domains » de Dokploy
#                  api → port 3000 · web → port 3000 · app → port 80
# ────────────────────────────────────────────────────────────────
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    image: ${APP_IMAGE_NAME:-lucko}-api:${VERSION:?VERSION manquante (ex. 0.1.0)}
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}?schema=public
      - CORS_ORIGINS=${CORS_ORIGINS}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - HOME_ADDRESS_KEYS=${HOME_ADDRESS_KEYS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - APPLE_CLIENT_SECRET=${APPLE_CLIENT_SECRET:-}
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN:-}
      - SMTP_URL=${SMTP_URL}
      - MAIL_FROM=${MAIL_FROM}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - SIGHTENGINE_API_USER=${SIGHTENGINE_API_USER:-}
      - SIGHTENGINE_API_SECRET=${SIGHTENGINE_API_SECRET:-}
      # Suivi des erreurs (GlitchTip partagé, dépôt Tools) ; vide = rien n'est envoyé
      - SENTRY_DSN=${SENTRY_DSN_API:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${VERSION:-}
      - OVERPASS_URLS=${OVERPASS_URLS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
      args:
        # Figée au build (variable publique Next.js)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_WEB:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    image: ${APP_IMAGE_NAME:-lucko}-web:${VERSION:?VERSION manquante (ex. 0.1.0)}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Version web de l'app Expo (export statique servi par nginx)
  app:
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
      args:
        # Figées au build (variables publiques Expo)
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
        EXPO_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        EXPO_PUBLIC_UMAMI_WEBSITE_ID: ${EXPO_PUBLIC_UMAMI_WEBSITE_ID:-}
        EXPO_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_APP:-}
        EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    image: ${APP_IMAGE_NAME:-lucko}-app:${VERSION:?VERSION manquante (ex. 0.1.0)}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Sauvegarde locale : pg_dump quotidien avec rétention (7 j + 4 hebdo + 6 mensuels).
  # NOTE : copie chiffrée hors serveur (ex. rclone vers un stockage objet) à ajouter.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    volumes:
      - postgres-backups:/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  postgres:
  postgres-backups:
