# ────────────────────────────────────────────────────────────────
# Lucko — stack Docker LOCALE
#
#   pnpm db:up        → profil « db » : PostgreSQL/PostGIS + Mailpit + stockage S3 (l'API et le site tournent avec `pnpm dev`)
#   pnpm docker:up    → profils db + backend + frontend : tout en conteneurs, images de production
#   pnpm db:down / pnpm docker:down
#
# Équivalent sans pnpm, depuis ce dossier : docker compose --profile db up -d
# Production : voir dokploy/docker-compose.dokploy.yml
# ────────────────────────────────────────────────────────────────
name: lucko

networks:
  # Réseau privé api <-> postgres
  lucko-internal:
    name: lucko-internal

services:
  postgres:
    container_name: lucko-postgres
    # Image multi-architecture (Mac Apple Silicon + x86) ; postgis/postgis n'existe qu'en amd64
    image: imresamu/postgis:17-3.5
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: lucko
      POSTGRES_PASSWORD: lucko
      POSTGRES_DB: lucko
    # Port de l'hôte modifiable si déjà pris : POSTGRES_PORT=5470 pnpm db:up
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5469}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lucko-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucko -d lucko"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    container_name: lucko-mailpit
    # Boîte mail de test : http://localhost:8025 (SMTP sur le port 1025)
    image: axllent/mailpit:v1.31.3
    profiles: [db]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - lucko-internal

  s3:
    container_name: lucko-s3
    # Stockage S3 des photos (RustFS, compatible MinIO) : API sur le port 9000, console sur http://localhost:9001
    image: rustfs/rustfs:1.0.1
    profiles: [db]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: lucko
      RUSTFS_SECRET_KEY: lucko-s3-local
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data
    networks:
      - lucko-internal

  s3-init:
    container_name: lucko-s3-init
    # Crée le bucket « lucko » : les photos de profil sont lisibles par URL, le bucket n'est pas listable
    image: amazon/aws-cli:2.38.1
    profiles: [db]
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: lucko
      AWS_SECRET_ACCESS_KEY: lucko-s3-local
      AWS_DEFAULT_REGION: fr-par
    entrypoint: [sh, -c]
    command:
      - |
        s3="aws --endpoint-url http://s3:9000 s3api"
        until $$s3 list-buckets > /dev/null 2>&1; do sleep 1; done
        $$s3 create-bucket --bucket lucko 2> /dev/null
        $$s3 put-bucket-policy --bucket lucko --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::lucko/avatars/*"}]}'
    networks:
      - lucko-internal

  api:
    container_name: lucko-api
    profiles: [backend]
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://lucko:lucko@postgres:5432/lucko?schema=public
      CORS_ORIGINS: http://localhost:3010,http://localhost:8081
      # Stack locale uniquement (comme les identifiants Postgres ci-dessus) : à remplacer sur un vrai serveur
      BETTER_AUTH_SECRET: lucko-local-docker-only-not-a-real-secret
      HOME_ADDRESS_KEYS: 1:bHVja28tbG9jYWwtZG9ja2VyLW9ubHkta2V5LTMyYiE=
      # E-mails dans Mailpit (http://localhost:8025), joint par son nom sur le réseau Docker
      SMTP_URL: smtp://mailpit:1025
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: lucko
      S3_ACCESS_KEY_ID: lucko
      S3_SECRET_ACCESS_KEY: lucko-s3-local
      S3_PUBLIC_URL: http://localhost:9000/lucko
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - lucko-internal
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    container_name: lucko-web
    profiles: [frontend]
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_SITE_URL: http://localhost:3010
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  postgres-data:
  s3-data:
