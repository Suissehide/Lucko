server {
  listen 80;
  root /usr/share/nginx/html;

  # Bundles nommés par empreinte : cache long
  location /_expo/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # App monopage : toute route inconnue renvoie index.html (expo-router gère la 404).
  # Revalidé à chaque visite : après un déploiement, index.html pointe tout de suite vers les nouveaux bundles.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html /index.html;
  }
}
