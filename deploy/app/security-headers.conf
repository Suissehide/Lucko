# En-têtes de sécurité, inclus dans chaque `location` (un add_header local annule ceux du bloc server)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP minimale : interdit l'intégration en iframe, les plugins et la réécriture de <base>.
# Les sources de scripts et de connexions (API, tuiles de carte, Umami, GlitchTip) restent libres.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
